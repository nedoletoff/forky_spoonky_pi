[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forky-spoonky-pi"
version = "0.1.0"
description = "Детектор вилок и ложек на YOLO с веб-интерфейсом и дообучением"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "forky_spoonky_pi" }]
dependencies = [
    "flask>=3.1",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "ultralytics>=8.3",
]

[project.optional-dependencies]
train = ["torch>=2.5", "torchvision>=0.20"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
forky-spoonky-pi = "forky_spoonky_pi.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forky_spoonky_pi = [
    "web/templates/*.html",
    "web/static/*.js",
    "web/static/*.css",
    "web/static/vendor/*.js",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
